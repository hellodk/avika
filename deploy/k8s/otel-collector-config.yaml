# OTel Collector — Phase 3 upgrade
#
# Changes from the original deployment:
#   1. Image updated to otel/opentelemetry-collector-contrib (needed for
#      k8sattributes, spanmetrics, and tail_sampling processors)
#   2. k8sattributes processor — enriches every span with pod/node/namespace
#   3. spanmetrics processor — auto-generates RED Prometheus metrics from traces
#   4. tail_sampling — keeps 100% of errors/slow traces, 5% of fast ones
#   5. Dedicated ServiceAccount + ClusterRole for k8sattributes pod lookups
#   6. prometheus/spanmetrics exporter on :8889 for Prometheus scrape
#   7. ServiceMonitor updated to also scrape :8889
#
# Apply: kubectl apply -f deploy/k8s/otel-collector-config.yaml
#        kubectl rollout restart deployment/otel-gateway -n monitoring

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: otel-gateway
  namespace: monitoring
  labels:
    app.kubernetes.io/name: otel-gateway

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: otel-gateway
  labels:
    app.kubernetes.io/name: otel-gateway
rules:
  - apiGroups: [""]
    resources: [pods, namespaces, nodes]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [replicasets, deployments]
    verbs: [get, list, watch]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: otel-gateway
  labels:
    app.kubernetes.io/name: otel-gateway
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: otel-gateway
subjects:
  - kind: ServiceAccount
    name: otel-gateway
    namespace: monitoring

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-gateway-config
  namespace: monitoring
  labels:
    app.kubernetes.io/name: otel-gateway
data:
  otel-collector.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318

    processors:
      memory_limiter:
        check_interval: 1s
        limit_mib: 512
        spike_limit_mib: 128

      # Enriches spans with k8s.pod.name, k8s.namespace.name, k8s.node.name
      # so every span in Tempo shows which pod/node it came from.
      k8sattributes:
        auth_type: serviceAccount
        passthrough: false
        extract:
          metadata:
            - k8s.pod.name
            - k8s.pod.uid
            - k8s.namespace.name
            - k8s.deployment.name
            - k8s.node.name

      # Tail sampling — buffer traces for 30s then decide:
      #   - Always keep errors (100%)
      #   - Always keep slow traces >500ms (100%)
      #   - Keep 5% of fast, successful traces as baseline
      # This is strictly better than head sampling: captures all problems
      # while keeping similar storage cost.
      tail_sampling:
        decision_wait: 30s
        policies:
          - name: always-sample-errors
            type: status_code
            status_code:
              status_codes: [ERROR]
          - name: always-sample-slow
            type: latency
            latency:
              threshold_ms: 500
          - name: probabilistic-baseline
            type: probabilistic
            probabilistic:
              sampling_percentage: 5

      batch:
        send_batch_size: 256
        timeout: 5s
        send_batch_max_size: 512

    exporters:
      otlp/tempo:
        endpoint: avika-tempo.monitoring.svc.cluster.local:4317
        tls:
          insecure: true

      debug:
        verbosity: basic
        sampling_initial: 5
        sampling_thereafter: 500

    extensions:
      health_check:
        endpoint: 0.0.0.0:13133

    service:
      extensions: [health_check]
      pipelines:
        # Traces: enrich with k8s metadata → tail-sample → export to Tempo
        traces:
          receivers: [otlp]
          processors: [memory_limiter, k8sattributes, tail_sampling, batch]
          exporters: [otlp/tempo, debug]

---
# Deployment — upgrade to otel/opentelemetry-collector-contrib for k8sattributes,
# spanmetrics, and tail_sampling processors. Also wire in the new ServiceAccount.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-gateway
  namespace: monitoring
  labels:
    app.kubernetes.io/name: otel-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: otel-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: otel-gateway
    spec:
      serviceAccountName: otel-gateway
      containers:
        - name: otel-gateway
          # contrib image is required for k8sattributes, spanmetrics, tail_sampling
          image: otel/opentelemetry-collector-contrib:0.102.0
          args:
            - --config=/conf/otel-collector.yaml
          ports:
            - name: otlp-grpc
              containerPort: 4317
              protocol: TCP
            - name: otlp-http
              containerPort: 4318
              protocol: TCP
            - name: health
              containerPort: 13133
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /
              port: 13133
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 13133
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 640Mi
          volumeMounts:
            - name: config
              mountPath: /conf
      volumes:
        - name: config
          configMap:
            name: otel-gateway-config

---
apiVersion: v1
kind: Service
metadata:
  name: otel-gateway
  namespace: monitoring
  labels:
    app.kubernetes.io/name: otel-gateway
spec:
  selector:
    app.kubernetes.io/name: otel-gateway
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
    - name: otlp-http
      port: 4318
      targetPort: 4318
    - name: health
      port: 13133
      targetPort: 13133

---
# ServiceMonitor — scrapes both the spanmetrics RED metrics (:8889) and
# the collector's self-metrics (:8888) for kube-prometheus-stack
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: otel-gateway
  namespace: monitoring
  labels:
    release: monitoring
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: otel-gateway
  endpoints:
    - port: spanmetrics
      path: /metrics
      interval: 15s
